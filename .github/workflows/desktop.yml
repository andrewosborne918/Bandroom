name: Bndrm desktop installers
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'worker/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            bundle: dmg
          - os: windows-2022
            arch: x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - name: Set up Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Set up Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Select Rust toolchain
        run: rustup default 1.90.0
      - name: Cache native build dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: bndrm-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Install desktop build tools
        working-directory: desktop
        run: npm ci
      - name: Create app icons
        run: |
          python -m pip install pillow==11.3.0
          python desktop/scripts/make_icons.py
      - name: Prepare native compilation
        run: python -c "from pathlib import Path; p=Path('desktop/src-tauri/runtime'); p.mkdir(exist_ok=True); (p/'compile-check.txt').write_text('Audio runtime is built after native compilation succeeds.')"
      - name: Compile desktop shell first
        run: cargo build --release --locked --features tauri/custom-protocol --target ${{ matrix.target }} --manifest-path desktop/src-tauri/Cargo.toml
      - name: Set up POSIX build tools on Windows
        id: msys
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils pkgconf
      - name: Select Windows build shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "BNDRM_BUILD_BASH=${{ steps.msys.outputs.msys2-location }}\usr\bin\bash.exe" >> $env:GITHUB_ENV
      - name: Build minimal FFmpeg
        run: python desktop/scripts/build_ffmpeg.py
      - name: Install CPU PyTorch on Windows
        if: runner.os == 'Windows'
        run: python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install audio build dependencies
        run: python -m pip install -r desktop/requirements-build.txt pillow==11.3.0
      - name: Build and verify the bundled processor
        run: python desktop/scripts/build_processor.py
      - name: Test actual frozen audio inference on Mac
        if: runner.os == 'macOS'
        run: python desktop/scripts/smoke_test.py desktop/src-tauri/runtime/bndrm-processor/bndrm-processor
      - name: Test actual frozen audio inference on Windows
        if: runner.os == 'Windows'
        run: python desktop/scripts/smoke_test.py desktop/src-tauri/runtime/bndrm-processor/bndrm-processor.exe
      - name: Build installer
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bndrm-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bndrm-*
          path: installers
          merge-multiple: true
      - name: Publish tested beta installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer build supersedes this release.'
            exit 0
          fi
          tag="desktop-v0.2.0-${GITHUB_SHA:0:7}"
          mapfile -t files < <(find installers -type f \( -name '*.dmg' -o -name '*.exe' \))
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --prerelease --title "Bndrm Desktop 0.2 beta" --notes-file desktop/RELEASE-NOTES.md
